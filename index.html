<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>home work 17</title>
  </head>
  <body>
    <main>
      <div class="container">
        <picture>
          <source
            media="(min-width: 320px)"
            srcset="image-extrasmall.webp 1x, image-extrasmallx2.webp 2x"
            type="image/webp"
          />
          <source
            media="(min-width: 768px)"
            srcset="image-small.webp 1x, image-small.webp 2x"
            type="image/webp"
          />
          <source
            media="(min-width: 1200px)"
            srcset="image-large.webp 1x, image-large.webp 2x"
            type="image/webp"
          />
          <source
            media="(min-width: 320px)"
            srcset="image-extrasmall.jpg 1x, image-extrasmall@2x.jpg 2x"
            type="image/jpeg"
          />
          <source
            media="(min-width: 768px)"
            srcset="image-small.jpg 1x, image-small@2x.jpg 2x"
            type="image/jpeg"
          />
          <source
            media="(min-width: 1200px)"
            srcset="image-large.jpg 1x, image-large@2x.jpg 2x"
            type="image/jpeg"
          />
          <img src="image.jpg" alt="Description of the image" />
        </picture>
      </div>
    </main>
  </body>
</html>
