<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>home work 17</title>
  </head>
  <body>
    <main>
      <div class="container">
        <picture>
          <source
            media="(min-width: 1200px)"
            srcset="./images/Cat-largex1.webp 1x, ./images/Cat-largex2.webp 2x"
            type="image/webp"
          />
          <source
            media="(min-width: 1200px)"
            srcset="./images/Cat-largex1.jpg 1x, ./images/Cat-largex2.jpg 2x"
            type="image/jpeg"
          />
          <source
            media="(min-width: 768px)"
            srcset="./images/Cat-smallx1.webp 1x, ./images/Cat-smallx2.webp 2x"
            type="image/webp"
          />
          <source
            media="(min-width: 768px)"
            srcset="./images/Cat-smallx1.jpg 1x, ./images/Cat-smallx2.jpg 2x"
            type="image/jpeg"
          />

          <source
            media="(min-width: 320px)"
            srcset="
              ./images/Cat-extrasmallx1.webp 1x,
              ./images/Cat-extrasmallx2.webp 2x
            "
            type="image/webp"
          />

          <source
            media="(min-width: 320px)"
            srcset="
              ./images/Cat-extrasmallx1.jpg 1x,
              ./images/Cat-extrasmallx2.jpg 2x
            "
            type="image/jpeg"
          />

          <img src="./images/Cat.jpg" alt="cat" />
        </picture>
      </div>
    </main>
  </body>
</html>
